name: Collect standalone Android Python runtime and downloader dependencies
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create independent Android build to force runtime downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline-probe/app/src/main/python offline-probe/app/src/main
          cat > offline-probe/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='AndroidPythonOfflineProbe'
          include(':app')
          EOF
          cat > offline-probe/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
              id 'com.chaquo.python' version '17.1.0' apply false
          }
          EOF
          cat > offline-probe/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > offline-probe/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.chaquo.python'
          }
          android {
              namespace 'com.archive.offlineprobe'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.archive.offlineprobe'
                  minSdk 29
                  targetSdk 35
                  versionCode 1
                  versionName '1'
                  ndk { abiFilters 'arm64-v8a' }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          chaquopy {
              defaultConfig {
                  version '3.13'
              }
          }
          EOF
          cat > offline-probe/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:name="com.chaquo.python.android.PyApplication" android:label="Offline Runtime Probe">
              <activity android:name="android.app.Activity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          echo "import gallery_dl, instaloader" > offline-probe/app/src/main/python/main.py
      - name: Resolve Android runtime first (no third-party Python dependencies)
        shell: bash
        run: |
          set +e
          (cd offline-probe && gradle --no-daemon --stacktrace :app:assembleDebug) > android-runtime-only-build.log 2>&1
          status=$?
          echo "Runtime-only Gradle exit code: $status"
          echo "$status" > runtime-only-exit-code.txt
          tail -n 35 android-runtime-only-build.log
          exit 0
      - name: Collect Python packages and runtime cache
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output/wheels
          python -m pip download --pre -d output/wheels 'gallery-dl==1.32.18' 'instaloader==4.16b1' > output/python-download.log 2>&1 || true
          sed -i "/version '3.13'/a\\                pip { install 'gallery-dl==1.32.18'; install 'instaloader==4.16b1' }" offline-probe/app/build.gradle
          set +e
          (cd offline-probe && gradle --no-daemon :app:assembleDebug) > output/python-android-build.log 2>&1
          echo "$?" > output/python-build-exit-code.txt
          set -e
          cp android-runtime-only-build.log output/
          cp runtime-only-exit-code.txt output/
          cp offline-probe/app/build/outputs/apk/debug/app-debug.apk output/runtime-probe.apk || true
          paths=(.gradle/caches)
          [ ! -d "$HOME/.cache/chaquopy" ] || paths+=(.cache/chaquopy)
          [ ! -d "$HOME/.gradle/chaquopy" ] || paths+=(.gradle/chaquopy)
          tar -C "$HOME" -czf output/runtime-cache.tar.gz "${paths[@]}"
          split -d -a 3 -b 75m output/runtime-cache.tar.gz output/runtime-cache.part-
          rm output/runtime-cache.tar.gz
          ls -lh output/
      - name: Upload standalone runtime dependency bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-android-python-runtime
          path: output/
          if-no-files-found: error
          retention-days: 3
