name: Collect standalone Android Python runtime and downloader dependencies
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create independent Android build to force runtime downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline-probe/app/src/main/python offline-probe/app/src/main
          cat > offline-probe/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='AndroidPythonOfflineProbe'
          include(':app')
          EOF
          cat > offline-probe/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
              id 'com.chaquo.python' version '17.1.0' apply false
          }
          EOF
          cat > offline-probe/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > offline-probe/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.chaquo.python'
          }
          android {
              namespace 'com.archive.offlineprobe'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.archive.offlineprobe'
                  minSdk 29
                  targetSdk 35
                  versionCode 1
                  versionName '1'
                  ndk { abiFilters 'arm64-v8a' }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          chaquopy {
              defaultConfig {
                  version '3.13'
              }
          }
          EOF
          cat > offline-probe/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:name="com.chaquo.python.android.PyApplication" android:label="Offline Runtime Probe">
              <activity android:name="android.app.Activity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          echo "import gallery_dl, instaloader" > offline-probe/app/src/main/python/main.py
      - name: Resolve Android runtime first (no third-party Python dependencies)
        shell: bash
        run: |
          set +e
          (cd offline-probe && gradle --no-daemon --stacktrace :app:assembleDebug) > android-runtime-only-build.log 2>&1
          status=$?
          echo "Runtime-only Gradle exit code: $status"
          echo "$status" > runtime-only-exit-code.txt
          tail -n 35 android-runtime-only-build.log
          exit 0
      - name: Add V1.5 downloader Python dependencies
        shell: bash
        run: |
          python - <<'PYTHON'
